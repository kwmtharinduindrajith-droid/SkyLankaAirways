<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notification Inbox & Preferences - SkyLanka Airways</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <span class="badge bg-primary-subtle text-primary mb-1"><i class="bi bi-bell-fill me-1"></i>Passenger Notifications Center</span>
                <h2 class="fw-bold text-dark mb-0"><i class="bi bi-bell-fill me-2 text-primary"></i>Notification Inbox & Preferences</h2>
            </div>
            <a th:href="@{/passenger/profile-history}" class="btn btn-outline-primary">
                <i class="bi bi-person-circle me-1"></i> View My Travel History
            </a>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="fw-bold mb-0"><i class="bi bi-inbox me-2 text-primary"></i>Your Travel Alerts</h5>
                        <span class="badge bg-danger" th:text="${unreadCount} + ' Unread'">0 Unread</span>
                    </div>
                    <div class="card-body p-0">
                        <div class="list-group list-group-flush">
                            <div th:each="n : ${notifications}" 
                                 th:class="'list-group-item p-3 ' + (${!n.isRead} ? 'bg-light border-start border-4 border-primary' : '')">
                                <div class="d-flex w-100 justify-content-between align-items-center mb-1">
                                    <h6 class="mb-1 fw-bold text-dark" th:text="${n.title}">Notification Title</h6>
                                    <small class="text-muted" th:text="${#temporals.format(n.sentTime, 'dd MMM, HH:mm')}"></small>
                                </div>
                                <p class="mb-2 text-secondary" th:text="${n.message}">Message content</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <span class="badge bg-secondary-subtle text-dark me-1" th:text="${n.channel}">WEB</span>
                                        <span class="badge bg-info-subtle text-dark" th:text="${n.notificationType}">FLIGHT_UPDATE</span>
                                    </div>
                                    <div class="btn-group btn-group-sm">
                                        <form th:if="${!n.isRead}" th:action="@{'/passenger/notifications/' + ${n.id} + '/read'}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-sm btn-outline-primary">Mark Read</button>
                                        </form>
                                        <form th:action="@{'/passenger/notifications/' + ${n.id} + '/delete'}" method="post" style="display:inline;">
                                            <button type="submit" class="btn btn-sm btn-outline-danger ms-1"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                            <div th:if="${#lists.isEmpty(notifications)}" class="p-5 text-center text-muted">
                                <i class="bi bi-bell-slash display-6 d-block mb-2"></i>
                                You have no notifications at this time.
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-3">
                    <div class="card-header bg-white py-3">
                        <h5 class="fw-bold mb-0 text-dark"><i class="bi bi-sliders me-2 text-primary"></i>Alert Preferences</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/passenger/notifications/preferences}" method="post">
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="emailEnabled" name="emailEnabled" value="true"
                                       th:checked="${preference != null ? preference.emailEnabled : true}">
                                <label class="form-check-label fw-semibold" for="emailEnabled">
                                    <i class="bi bi-envelope me-1 text-primary"></i> Email Notifications
                                    <small class="text-muted d-block fw-normal">E-tickets, tax invoices, and flight alerts</small>
                                </label>
                            </div>

                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="smsEnabled" name="smsEnabled" value="true"
                                       th:checked="${preference != null ? preference.smsEnabled : true}">
                                <label class="form-check-label fw-semibold" for="smsEnabled">
                                    <i class="bi bi-phone me-1 text-success"></i> SMS Text Alerts
                                    <small class="text-muted d-block fw-normal">Critical flight delays & gate updates</small>
                                </label>
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="webEnabled" name="webEnabled" value="true"
                                       th:checked="${preference != null ? preference.webEnabled : true}">
                                <label class="form-check-label fw-semibold" for="webEnabled">
                                    <i class="bi bi-browser-chrome me-1 text-info"></i> In-App Web Alerts
                                    <small class="text-muted d-block fw-normal">Real-time alerts inside passenger dashboard</small>
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 fw-bold">
                                <i class="bi bi-check2-circle me-1"></i> Save Preferences
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Master - SkyLanka Airways</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="ams-body">
    <div class="ams-layout">
        <!-- Sidebar -->
        <div th:replace="~{fragments/manager-sidebar :: sidebar}"></div>
        
        <!-- Main Content -->
        <div class="ams-main">
            <!-- Header -->
            <div th:replace="~{fragments/manager-sidebar :: header(pageTitle='Airport Management')}"></div>
            
            <div class="ams-content">

                <!-- Premium Page Strip -->
                <div class="ams-page-strip d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
                    <div>
                        <div style="font-size: 0.72rem; color: #60a5fa; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;">
                            <i class="bi bi-building me-1"></i> Airport Management
                        </div>
                        <h4 class="fw-bold text-white mb-1">Airport Hubs Master</h4>
                        <p>Manage global airport infrastructure and hub configurations.</p>
                    </div>
                </div>

                <div class="container-fluid px-0 mb-5">

                    <!-- Toast / Alerts -->
                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div class="row g-4">
                        <div class="col-lg-12">
                            <div class="ams-card mb-4">
                                <div class="ams-card-header">
                                    <h6 class="ams-card-title mb-0">
                                        <span class="ti-green"><i class="bi bi-building"></i></span>
                                        Airport Hubs
                                    </h6>
                                    <button class="btn btn-sm btn-ams-success" data-bs-toggle="collapse" data-bs-target="#newAirportForm">
                                        <i class="bi bi-plus-circle me-1"></i> Add Airport
                                    </button>
                                </div>

                                <!-- Collapsible Add Airport Form -->
                                <div class="collapse ams-form-section mx-3 mt-3 mb-0" id="newAirportForm">
                                    <h6><i class="bi bi-plus-lg me-1"></i> Register New Airport Hub</h6>
                                    <form th:action="@{/manager/airports/save}" method="post">
                                        <div class="mb-2">
                                            <label class="form-label small fw-bold">IATA Code (3 Uppercase Letters) *</label>
                                            <input type="text" name="code" maxlength="3" minlength="3" pattern="^[A-Za-z]{3}$" 
                                                   class="form-control text-uppercase" placeholder="e.g. SIN" required>
                                        </div>
                                        <div class="mb-2">
                                            <label class="form-label small fw-bold">Airport Name *</label>
                                            <input type="text" name="name" class="form-control" placeholder="e.g. Changi International Airport" required>
                                        </div>
                                        <div class="row g-2 mb-3">
                                            <div class="col-6">
                                                <label class="form-label small fw-bold">City *</label>
                                                <input type="text" name="city" class="form-control" placeholder="e.g. Singapore" required>
                                            </div>
                                            <div class="col-6">
                                                <label class="form-label small fw-bold">Country *</label>
                                                <input type="text" name="country" class="form-control" placeholder="e.g. Singapore" required>
                                            </div>
                                        </div>
                                        <div class="text-end mt-4">
                                            <button type="button" class="btn btn-outline-secondary btn-sm me-2" data-bs-toggle="collapse" data-bs-target="#newAirportForm">Cancel</button>
                                            <button type="submit" class="btn btn-sm btn-ams-success"><i class="bi bi-check2-circle me-1"></i> Register Airport</button>
                                        </div>
                                    </form>
                                </div>

                                <!-- Edit Airport Modal -->
                                <div class="modal fade" id="editAirportModal" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2"></i>Edit Airport</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                            </div>
                                            <form th:action="@{/manager/airports/save}" method="post">
                                                <div class="modal-body">
                                                    <input type="hidden" name="id" id="editAirportId">
                                                    <div class="mb-3">
                                                        <label class="form-label small fw-bold">IATA Code *</label>
                                                        <input type="text" name="code" id="editAirportCode" maxlength="3" minlength="3" pattern="^[A-Za-z]{3}$" 
                                                               class="form-control text-uppercase" required>
                                                    </div>
                                                    <div class="mb-3">
                                                        <label class="form-label small fw-bold">Airport Name *</label>
                                                        <input type="text" name="name" id="editAirportName" class="form-control" required>
                                                    </div>
                                                    <div class="row g-2 mb-3">
                                                        <div class="col-6">
                                                            <label class="form-label small fw-bold">City *</label>
                                                            <input type="text" name="city" id="editAirportCity" class="form-control" required>
                                                        </div>
                                                        <div class="col-6">
                                                            <label class="form-label small fw-bold">Country *</label>
                                                            <input type="text" name="country" id="editAirportCountry" class="form-control" required>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                                    <button type="submit" class="btn btn-success fw-bold">Save Changes</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>

                                <div class="table-responsive">
                                    <table class="ams-table">
                                        <thead>
                                            <tr>
                                                <th class="ps-4">Code</th>
                                                <th>City / Country</th>
                                                <th>Status</th>
                                                <th class="text-end pe-4">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:if="${airports == null or airports.empty}">
                                                <td colspan="4" class="text-center py-4 text-muted">No airports registered.</td>
                                            </tr>
                                            <tr th:each="a : ${airports}">
                                                <td>
                                                    <span class="badge bg-dark fw-bold fs-6" th:text="${a.airportCode}">CMB</span>
                                                </td>
                                                <td>
                                                    <div class="fw-bold" th:text="${a.city}">Colombo</div>
                                                    <div class="small text-muted" th:text="${a.airportName + ' (' + a.country + ')'}">Bandaranaike Intl</div>
                                                </td>
                                                <td>
                                                    <span th:if="${a.active}" class="badge bg-success-subtle text-success border border-success-subtle">
                                                        <i class="bi bi-check-circle-fill me-1"></i>Active
                                                    </span>
                                                    <span th:unless="${a.active}" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">
                                                        <i class="bi bi-pause-circle-fill me-1"></i>Deactivated
                                                    </span>
                                                </td>
                                                <td class="text-end pe-4">
                                                    <button class="btn btn-sm btn-outline-primary me-1"
                                                            th:data-id="${a.id}"
                                                            th:data-code="${a.airportCode}"
                                                            th:data-name="${a.airportName}"
                                                            th:data-city="${a.city}"
                                                            th:data-country="${a.country}"
                                                            onclick="editAirport(this.getAttribute('data-id'), this.getAttribute('data-code'), this.getAttribute('data-name'), this.getAttribute('data-city'), this.getAttribute('data-country'))">
                                                        <i class="bi bi-pencil me-1"></i>Edit
                                                    </button>
                                                    <a th:if="${a.active}" th:href="@{/manager/airports/delete/{id}(id=${a.id})}" 
                                                       onclick="return confirm('Deactivate this airport? It will no longer be available for new routes, but historical flight and route records will be preserved.');"
                                                       class="btn btn-outline-danger btn-sm" title="Deactivate Airport">
                                                        <i class="bi bi-power me-1"></i>Deactivate
                                                    </a>
                                                    <span th:unless="${a.active}" class="badge bg-light text-muted border py-1 px-2">
                                                        <i class="bi bi-archive me-1"></i>Archived
                                                    </span>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function editAirport(id, code, name, city, country) {
            document.getElementById('editAirportId').value = id;
            document.getElementById('editAirportCode').value = code;
            document.getElementById('editAirportName').value = name;
            document.getElementById('editAirportCity').value = city;
            document.getElementById('editAirportCountry').value = country;
            new bootstrap.Modal(document.getElementById('editAirportModal')).show();
        }
    </script>
</body>
</html>

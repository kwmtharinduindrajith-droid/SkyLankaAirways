<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ========== PREMIUM AMS SIDEBAR ========== -->
<div th:fragment="sidebar" class="ams-sidebar">

    <!-- Brand -->
    <a th:href="@{/manager/dashboard}" class="brand">
        <div class="brand-logo-icon">
            <i class="bi bi-airplane-fill text-white" style="font-size: 1rem;"></i>
        </div>
        <div>
            <div style="font-size: 1rem; font-weight: 800; color: white; line-height: 1.1;">SkyLanka</div>
            <div style="font-size: 0.65rem; font-weight: 500; color: #60a5fa; letter-spacing: 1.5px; text-transform: uppercase;">Operations Center</div>
        </div>
    </a>

    <div class="ams-nav">
        <!-- OPERATIONS -->
        <div class="ams-nav-section-label">Operations</div>
        <a th:href="@{/manager/dashboard}" class="ams-nav-link">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a th:href="@{/manager/flights}" class="ams-nav-link">
            <i class="bi bi-calendar-range"></i> Flight Schedules
        </a>
        <a th:href="@{/manager/flight-registry}" class="ams-nav-link">
            <i class="bi bi-airplane"></i> Fleet Registry
        </a>
        <a th:href="@{/manager/aircrafts}" class="ams-nav-link">
            <i class="bi bi-airplane-engines"></i> Aircraft Fleet
        </a>
        <a th:href="@{/manager/flights/new}" class="ams-nav-link">
            <i class="bi bi-plus-circle"></i> Schedule Flight
        </a>
        <a th:href="@{/manager/flight-history}" class="ams-nav-link">
            <i class="bi bi-clock-history"></i> Flight History
        </a>

        <!-- NETWORK -->
        <div class="ams-nav-section-label" style="margin-top: 8px;">Network</div>
        <a th:href="@{/manager/routes}" class="ams-nav-link">
            <i class="bi bi-bezier2"></i> Route Management
        </a>
        <a th:href="@{/manager/airports}" class="ams-nav-link">
            <i class="bi bi-building"></i> Airport Hubs
        </a>
    </div>

    <!-- Footer / Logout -->
    <div class="ams-sidebar-footer">
        <div style="padding: 0 4px 10px; font-size: 0.72rem; color: #334155; text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700;">
            Session
        </div>
        <form th:action="@{/auth/logout}" method="post" class="m-0">
            <button type="submit" class="ams-logout-btn">
                <i class="bi bi-box-arrow-left"></i> Sign Out
            </button>
        </form>
    </div>
</div>

<!-- ========== AMS TOP HEADER ========== -->
<header th:fragment="header" class="ams-header">
    <div class="d-flex align-items-center gap-3">
        <div class="page-title" th:text="${pageTitle != null ? pageTitle : 'Airline Management System'}">Dashboard</div>
    </div>

    <div class="d-flex align-items-center gap-3">
        <a th:href="@{/home}" class="btn btn-sm btn-light border text-muted fw-semibold" style="border-radius: 10px;">
            <i class="bi bi-globe me-1"></i> Public Site
        </a>

        <div class="position-relative" style="cursor: pointer;">
            <i class="bi bi-bell fs-5 text-muted" style="transition: color 0.2s;"></i>
            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle" style="width:8px; height:8px; padding: 0 !important;"></span>
        </div>

        <div class="dropdown">
            <button class="btn btn-light d-flex align-items-center gap-2 border-0 fw-semibold" type="button"
                    data-bs-toggle="dropdown" style="border-radius: 12px; padding: 6px 12px; background: #f1f5f9;">
                <div class="d-flex align-items-center justify-content-center text-white fw-bold"
                     style="width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); font-size: 0.85rem;">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="d-none d-md-block" style="text-align: left;">
                    <div style="font-size: 0.8rem; font-weight: 700; color: #1e293b;" sec:authentication="name">Manager</div>
                    <div style="font-size: 0.68rem; color: #94a3b8; line-height: 1;">Flight Manager</div>
                </div>
                <i class="bi bi-chevron-down text-muted" style="font-size: 0.7rem;"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0" style="border-radius: 14px; padding: 8px; min-width: 200px;">
                <li class="px-2 py-1 mb-1">
                    <div style="font-size: 0.8rem; font-weight: 700; color: #1e293b;" sec:authentication="name">Manager</div>
                    <div style="font-size: 0.72rem; color: #94a3b8;">Flight Operations Manager</div>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/auth/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item text-danger fw-semibold" style="border-radius: 8px; font-size: 0.875rem;">
                            <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>

</html>
